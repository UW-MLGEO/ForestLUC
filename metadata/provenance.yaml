  - name: MOD13Q1
    earth_engine_id: MODIS/061/MOD13Q1
    version: 061
    role: vegetation_indices
    license: Public Domain  
    citation: Didan,  Kamel. (2021). MODIS/Terra Vegetation Indices 16-Day L3 Global 250m SIN Grid V061 [Data set]. NASA Land Processes Distributed Active Archive Center. https://doi.org/10.5067/MODIS/MOD13Q1.061
    doi: https://doi.org/10.5067/MODIS/MOD13Q1.061

  - name: MOD15A2H
    earth_engine_id: MODIS/061/MOD15A2H
    version: 061
    role: vegetation_structure
    license: Public Domain
    citation: Myneni,  Ranga, Knyazikhin,  Yuri, & Park,  Taejin. (2021). MODIS/Terra Leaf Area Index/FPAR 8-Day L4 Global 500m SIN Grid V061 [Data set]. NASA Land Processes Distributed Active Archive Center. https://doi.org/10.5067/MODIS/MOD15A2H.061
    doi: https://doi.org/10.5067/MODIS/MOD15A2H.061 

  - name: MCD12Q1
    earth_engine_id: MODIS/061/MCD12Q1
    version: 061
    role: landcover
    license: Public Domain
    citation: Friedl,  Mark, & Sulla-Menashe,  Damien. (2022). MODIS/Terra+Aqua Land Cover Type Yearly L3 Global 500m SIN Grid V061 [Data set]. NASA Land Processes Distributed Active Archive Center. https://doi.org/10.5067/MODIS/MCD12Q1.061
    doi: https://doi.org/10.5067/MODIS/MCD12Q1.061 

  - name: GTOPO30
    earth_engine_id: USGS/GTOPO30
    role: terrain
    license: Public Domain
    citation: GTOPO30 DEM courtesy of the U.S. Geological Survey
    doi: https://doi.org/10.5066/F7DF6PQS

  - name: WHRC Pantropical National Level Carbon Stock Dataset
    earth_engine_id: WHRC/biomass/tropical
    role: alternate_reference_layer
    license: Public Domain
    citation: A. Baccini, S J. Goetz, W.S. Walker, N. T. Laporte, M. Sun, D. Sulla-Menashe, J. Hackler, P.S.A. Beck, R. Dubayah, M.A. Friedl, S. Samanta and R. A. Houghton. Estimated carbon dioxide emissions from tropical deforestation improved by carbon-density maps. 2012 Nature Climate Change, 
    doi: https://doi.org/10.1038/NCLIMATE1354

    description: >
    Independent tropical biomass map used to test for reproducibility. 
    Not used as the primary target.

processing:

  temporal_window:
    start_date: 2010-01-01
    end_date: 2011-01-01

  spatial_resolution_m: 500

  aggregations:
    vegetation_indices: median
    lai_fpar: median
    landcover: mode

  scaling:
    ndvi: 0.0001
    evi: 0.0001
    lai: 0.1
    fpar: 0.01