dataset_name: Central_Sulawesi_AGC_ML_Dataset_2010

study_area:
  province: Sulawesi Tengah
  country: Indonesia

retrieval:
  platform: Google Earth Engine
  retrieval_date: 2026-11-02
  access_method: Earth Engine Python API

data_generation:
  synthetic_data: false
  augmented_data: false

  description: >
    All observations originate from published remote-sensing
    products accessed through Google Earth Engine. No synthetic
    observations, simulated labels, oversampling, or AI-generated
    predictors were introduced.

sources:

  - name: FAO GAUL Simplified 500m Level 1
    earth_engine_id: FAO/GAUL_SIMPLIFIED_500m/2025/level1
    version: 2025
    role: study_area_boundary
    license: CC-BY-4.0
    citation: FAO. 2025. Global Administrative Unit Layers (GAUL). https://data.apps.fao.org. 

  - name: NASA ORNL Biomass Carbon Density
    earth_engine_id: NASA/ORNL/biomass_carbon_density/v1
    version: v1
    role: target_variable
    license: Public Domain
    citation: Spawn, S.A., and H.K. Gibbs. 2020. Global Aboveground and Belowground Biomass Carbon Density Maps for the Year 2010. ORNL DAAC, Oak Ridge, Tennessee, USA
    doi: https://doi.org/10.3334/ORNLDAAC/1763 
